repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, test, chore, docs, perf, style, ci, build, revert]

  - repo: local
    hooks:
      # Runs in the project environment: an isolated pyright env cannot resolve fastapi/openai
      # and would report every import as unknown under strict mode.
      - id: pyright
        name: pyright (project environment)
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: pytest (unit only)
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
