[project]
name = "byte"
version = "0.1.0"
description = "Byte — personal assistant backend. Hexagonal architecture, one agent, chat + live voice, tools as adapters, Docker."
requires-python = ">=3.12"
authors = [{ name = "Felipe" }]
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "tzdata>=2024.1",  # zoneinfo has no tz database on Windows or in the slim image
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
openai = [
    "openai>=2.35",
]
gemini = [
    "google-genai>=2.0",
]
thinq = [
    "thinqconnect>=1.0.14",
    "aiohttp>=3.9",
]
tuya = [
    "tinytuya>=1.17",
]
spotify = [
    "aiohttp>=3.9",
]
google = [
    "aiohttp>=3.9",
]
weather = [
    "aiohttp>=3.9",
]
tts = [
    "piper-tts>=1.3",
]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.13",
]
embed = [
    "fastembed>=0.7",
]
pty = [
    "pywinpty>=2.0; sys_platform == 'win32'",
]
voice = [
    "sounddevice>=0.5",
    "websockets>=14",
    "numpy>=1.26",
    "scipy>=1.11",
    "onnxruntime>=1.16",
]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.385",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "httpx>=0.27",
    "websockets>=14",
    "pip-tools>=7.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "piper-tts>=1.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.13",
    "fastembed>=0.7",
    "testcontainers[postgres]>=4.8",
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "voice"]

# ─────────────────────────────────────────────────────────────
# Ruff: lint + format (substitui black, isort, flake8, pyupgrade)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "PL",  # pylint
    "ANN", # flake8-annotations (type hints obrigatórios)
]
ignore = [
    "PLR0913", # too many arguments (use cases podem ter)
    "S101",   # assert (pytest usa)
    "B008",   # FastAPI Depends() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PLR2004"]
"main.py" = ["ANN"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
known-first-party = ["app", "voice"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────
# Pyright: type checking strict
# ─────────────────────────────────────────────────────────────
[tool.pyright]
include = ["app", "voice", "tests", "main.py"]
exclude = [".venv", "build", "dist"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"

# ─────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not integration",
    "--cov=app",
    "--cov=voice",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated tests (default)",
    "integration: hits real vendors (OpenAI, Tuya, Google). Run with: pytest -m integration",
    "slow: takes >1s",
]

[tool.coverage.run]
branch = true
source = ["app", "voice"]
omit = ["app/adapters/openai/**", "app/adapters/gemini/live_session.py", "app/adapters/postgres/**", "app/adapters/fastembed/**", "app/adapters/pty/**", "app/ports/**", "voice/audio.py", "voice/wake.py"]  # openai + gemini session, postgres, fastembed, pty: integration only; ports: pure ABCs; voice/audio+wake: hardware and model, tested by hand

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
