[project]
name = "marcelo"
version = "0.1.0"
description = "Personal AI assistant. Hexagonal architecture, multi-channel (WhatsApp/Telegram/Email), tool-extensible."
requires-python = ">=3.12"
authors = [{ name = "Felipe" }]
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
agent = [
    "agno>=1.5",
    "groq>=0.11",
    "google-generativeai>=0.8",
    "google-genai>=1.0",
]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "alembic>=1.13",
]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.385",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "testcontainers[postgres]>=4.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────────────────────────────────────────
# Ruff: lint + format (substitui black, isort, flake8, pyupgrade)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "PL",  # pylint
    "ANN", # flake8-annotations (type hints obrigatórios)
]
ignore = [
    "ANN101", # missing self type
    "ANN102", # missing cls type
    "PLR0913", # too many arguments (use cases podem ter)
    "S101",   # assert (pytest usa)
    "B008",   # FastAPI Depends() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PLR2004"]
"main.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────
# Pyright: type checking strict
# ─────────────────────────────────────────────────────────────
[tool.pyright]
include = ["app", "tests", "main.py"]
exclude = [".venv", "build", "dist"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPath = "C:/Users/fenil/anaconda3/python.exe"
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"

# ─────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated tests (default)",
    "integration: hits real adapters (DB, network)",
    "slow: takes >1s",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/adapters/**",
    "app/api/**",
    "app/config.py",
    "app/ports/**",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
