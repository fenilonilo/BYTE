services:
  # HTTPS front door: serves the panel and proxies /api/* (WebSockets included) to the API.
  # Loopback by default; set BYTE_PUBLISH_HOST=<LAN IP> to open it to the house.
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "${BYTE_PUBLISH_HOST:-127.0.0.1}:443:443"
      - "${BYTE_PUBLISH_HOST:-127.0.0.1}:80:80"  # redirects to https
    environment:
      BYTE_SITE: ${BYTE_SITE:-byte.local}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy-data:/data  # holds the local CA: keep it, or every phone must trust a new root
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      # Host loopback only: voice/ on this machine talks to it directly over ws://.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Piper voice for reminders (BYTE_PIPER_MODEL=models/pt_BR-faber-medium.onnx)
      - ./backend/models:/app/models:ro
      # reminders.json: a named volume keeps the non-root owner from the image
      - byte-data:/app/data
    environment:
      # inside compose the API reaches the database by service name
      BYTE_DATABASE_URL: postgresql+asyncpg://byte:${BYTE_DB_PASSWORD}@db:5432/byte
      BYTE_WEB: "false"  # Caddy serves the panel
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Vector store for project knowledge (Spec 4). Loopback only; Byte on Windows/uvicorn uses it too.
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: byte
      POSTGRES_USER: byte
      POSTGRES_PASSWORD: ${BYTE_DB_PASSWORD:?set BYTE_DB_PASSWORD in .env}
    volumes:
      - byte-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byte -d byte"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  byte-data:
  byte-db:
  caddy-data:
  caddy-config:
